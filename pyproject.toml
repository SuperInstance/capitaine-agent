[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capitaine-agent"
version = "0.2.0"
description = "Multi-agent coordination library — mission planning, crew delegation, tactical strategy scoring, and debrief reporting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SuperInstance", email = "cocapn@proton.me"},
]
keywords = ["multi-agent", "coordination", "mission-planning", "crew", "delegation", "tactics", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx"]

[project.scripts]
capitaine = "capitaine_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capitaine_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"